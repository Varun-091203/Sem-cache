<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SemCache demo</title>
  <style>
    /* All colours are defined once here, so they are easy to change */
    :root {
      --bg: #f6f7f9;  --card: #ffffff;  --text: #1a2230;  --muted: #5d6879;
      --line: #dde1e8;  --accent: #1f3a5f;  --on-accent: #ffffff;
      --hit-bg: #e3f4ea;  --hit-text: #14532d;
      --miss-bg: #fff3dd;  --miss-text: #8a4b08;
      --err-bg: #fde8e8;  --err-text: #8a1c1c;
    }
    /* Automatic dark mode when the phone or laptop is set to dark */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f141b;  --card: #18202b;  --text: #e8edf4;  --muted: #9aa6b8;
        --line: #2b3544;  --accent: #7fb0ff;  --on-accent: #0f141b;
        --hit-bg: #12301f;  --hit-text: #8be0ab;
        --miss-bg: #33250f;  --miss-text: #f2c27a;
        --err-bg: #3a1717;  --err-text: #f5a3a3;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text); line-height: 1.5;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
    .tagline { margin: 0 0 24px; color: var(--muted); }

    /* The question box and the Ask button sit side by side */
    form { display: flex; gap: 8px; }
    input {
      flex: 1; min-width: 0; padding: 12px 14px; font-size: 16px;
      color: var(--text); background: var(--card);
      border: 1px solid var(--line); border-radius: 10px;
    }
    button { font: inherit; cursor: pointer; }
    .primary {
      padding: 12px 20px; font-size: 16px; font-weight: 600;
      color: var(--on-accent); background: var(--accent); border: 0; border-radius: 10px;
    }
    .primary:disabled { opacity: 0.6; cursor: wait; }
    input:focus, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Example questions you can click */
    .examples { margin: 16px 0 0; }
    .examples p { margin: 0 0 8px; font-size: 14px; color: var(--muted); }
    .chip {
      margin: 0 6px 6px 0; padding: 6px 12px; font-size: 14px; text-align: left;
      color: var(--text); background: var(--card);
      border: 1px solid var(--line); border-radius: 999px;
    }
    .chip:hover { border-color: var(--accent); }

    /* The result card */
    #result {
      margin-top: 24px; padding: 16px; background: var(--card);
      border: 1px solid var(--line); border-radius: 12px;
    }
    #result[hidden] { display: none; }
    .badge {
      display: inline-block; padding: 2px 10px; font-size: 13px; font-weight: 700;
      letter-spacing: 0.04em; border-radius: 999px;
    }
    .hit { background: var(--hit-bg); color: var(--hit-text); }
    .miss { background: var(--miss-bg); color: var(--miss-text); }
    .error { background: var(--err-bg); color: var(--err-text); }
    #answer { margin: 12px 0 8px; font-size: 18px; overflow-wrap: anywhere; }
    #meta { margin: 0; font-size: 14px; color: var(--muted); }

    /* Live statistics */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 24px; }
    .stat { padding: 12px; text-align: center; background: var(--card);
            border: 1px solid var(--line); border-radius: 12px; }
    .stat b { display: block; font-size: 22px; }
    .stat span { font-size: 13px; color: var(--muted); }
    footer { margin-top: 32px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>SemCache</h1>
  <p class="tagline">A semantic cache for AI apps. Ask a question, then ask it again in different words.</p>

  <form id="form">
    <input id="q" type="text" placeholder="Type a question" aria-label="Your question" autocomplete="off">
    <button id="go" class="primary" type="submit">Ask</button>
  </form>

  <div class="examples">
    <p>Try these, in order:</p>
    <button class="chip" type="button">How do I reset my password?</button>
    <button class="chip" type="button">I forgot my password, what should I do?</button>
    <button class="chip" type="button">What is the capital of France?</button>
  </div>

  <!-- aria-live makes screen readers announce each new result -->
  <section id="result" aria-live="polite" hidden>
    <span id="badge" class="badge"></span>
    <p id="answer"></p>
    <p id="meta"></p>
  </section>

  <div class="stats">
    <div class="stat"><b id="hits">0</b><span>Hits</span></div>
    <div class="stat"><b id="misses">0</b><span>Misses</span></div>
    <div class="stat"><b id="rate">0%</b><span>Hit rate</span></div>
  </div>

  <footer>HIT = answered from memory (no AI call). MISS = the AI was asked. The AI here is simulated.</footer>
</main>

<script>
  const input = document.getElementById("q");
  const button = document.getElementById("go");
  const result = document.getElementById("result");
  const badge = document.getElementById("badge");
  const answer = document.getElementById("answer");
  const meta = document.getElementById("meta");

  // Show a result card. We use textContent (not innerHTML), so text typed by a
  // user can never run as code on the page.
  function show(kind, label, text, details) {
    result.hidden = false;
    badge.className = "badge " + kind;      // colours the badge: hit, miss or error
    badge.textContent = label;
    answer.textContent = text;
    meta.textContent = details;
  }

  // Read /stats from the server and update the three boxes
  async function loadStats() {
    try {
      const res = await fetch("/stats");
      const s = await res.json();
      document.getElementById("hits").textContent = s.hits;
      document.getElementById("misses").textContent = s.misses;
      document.getElementById("rate").textContent = Math.round(s.hit_rate * 100) + "%";
    } catch (err) {
      // stats are optional, so we ignore a failure here
    }
  }

  // Ask the cache a question
  async function ask(question) {
    question = question.trim();
    if (!question) return;                  // ignore an empty box
    button.disabled = true;                 // stop double clicks while waiting
    button.textContent = "Asking...";
    try {
      const res = await fetch("/ask?question=" + encodeURIComponent(question));
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "The server replied with an error (" + res.status + ").");
      const secs = data.seconds.toFixed(2);   // always show 2 decimals, e.g. 0.00 or 1.02
      if (data.from_cache) {
        show("hit", "HIT", data.answer, "Answered from memory in " + secs + " seconds");
      } else {
        show("miss", "MISS", data.answer, "Asked the AI, which took " + secs + " seconds");
      }
      loadStats();
    } catch (err) {
          show("error", "ERROR", err.message, "If this keeps happening, check that the server is running.");
    } finally {
      button.disabled = false;
      button.textContent = "Ask";
    }
  }

  // Pressing Enter or clicking Ask submits the form
  document.getElementById("form").addEventListener("submit", function (event) {
    event.preventDefault();                 // stop the browser reloading the page
    ask(input.value);
  });

  // Clicking an example fills the box and asks it
  document.querySelectorAll(".chip").forEach(function (chip) {
    chip.addEventListener("click", function () {
      input.value = chip.textContent;
      ask(chip.textContent);
    });
  });

  loadStats();                              // fill the stats boxes when the page opens
</script>
</body>
</html>
